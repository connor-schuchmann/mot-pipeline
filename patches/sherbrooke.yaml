id: sherbrooke

dataset:
  id: sherbrooke
  root: "/home/connor-schuchmann/UrbanTracker/datasets/UrbanTracker-Benchmark"
  layout: mot
  box_type: aabb
  # one benchmark per split dir: the metrics stage scores everything it finds
  splits:
    train: "train_sherbrooke"
  default_split: train
  # no bicycles in this sequence's gt
  classes:
    1: car
    2: pedestrian

evaluation:
  # detector_id is the COCO id written into det.txt, not the gt id
  classes:
    - name: car
      dataset_id: 1
      detector_id: 2
      detector_name: car
    - name: pedestrian
      dataset_id: 2
      detector_id: 0
      detector_name: person

download:
  runs: ""

detector:
  id: yolo26m
  model: "models/yolo26m.pt"
  conf: 0.1
  classes:
    0: person
    1: bicycle
    2: car

reid:
  id: osnet_x0_25_msmt17
  model: "models/osnet_x0_25_msmt17.pt"
  device: ""
  half: true
  preprocess: resize
